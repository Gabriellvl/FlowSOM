name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: "*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        include:
          # - os: ubuntu-latest
          #   python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          # - os: ubuntu-latest
          #   python: "3.11"
          #   pip-flags: "--pre"
          #   name: PRE-RELEASE DEPENDENCIES

    name: Python ${{ matrix.python }}

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace and conflict markers
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # cache: "pip"
          # cache-dependency-path: "**/pyproject.toml"

      - name: Check Python style in changed files
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install 'ruff==0.1.14'
          git diff --name-only --diff-filter=ACMR -z HEAD^1 HEAD -- '*.py' '*.pyi' > "$RUNNER_TEMP/changed-python"
          mapfile -d '' -t files < "$RUNNER_TEMP/changed-python"
          if (( ${#files[@]} )); then
            python -m ruff check -- "${files[@]}"
            python -m ruff format --check -- "${files[@]}"
          fi
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel
      - name: Install dependencies
        run: |
          python -m pip install ${{ matrix.pip-flags }} ".[dev,test]"
      - name: Test
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: |
          python -m coverage run -m pytest -v --color=yes
      - name: Report coverage
        run: |
          python -m coverage report
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
